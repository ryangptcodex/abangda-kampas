<script>
  let categoriesState = [];
  let brandsState = [];
  let bannersState = [];
  let settingsState = {};
  let cartState = [];
  let activeCategoryFilter = 'ALL';
  let activeBrandFilter = 'ALL';
  let currentPage = 1;
  let limitPage = 6;
  let isLoadingProducts = false;
  let hasMoreProducts = true;
  let selectedModalProduct = null;
  let modalQty = 1;
  let appliedCoupon = null;
  let couponCheckVersion = 0, couponCheckPending = false, couponSlowTimer = null, couponTimeoutTimer = null;
  const couponPreviewMemo = new Map();
  let searchDebounceTimer = null;
  let trackingRequestVersion = 0;
  let catalogRequestVersion = 0, suggestionRequestVersion = 0, modalRequestVersion = 0;

  const CART_STORAGE_KEY = 'tokoAbangda.cart.v1';
  const CART_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
  let cartStorageAvailable = true;
  let cartRestoreRequired = false;
  let cartIsRestoring = false;
  let cartRestoreVersion = 0;
  let cartCheckoutPending = false;
  let recoveredReceipt = null;

  function setCartNotice(message, retry, discard) {
    let box = document.getElementById('cartStorageNotice');
    if (!box) {
      box = document.createElement('div');
      box.id = 'cartStorageNotice';
      box.setAttribute('role', 'status');
      box.style.cssText = 'margin:8px 16px;padding:12px;border-radius:12px;background:#f0f9ff;color:#075985;font-size:12px;flex-shrink:0';
      const host = document.getElementById('cartItemsContainer');
      if (host) host.before(box);
      else (document.querySelector('main') || document.body).prepend(box);
    }
    box.replaceChildren();
    box.hidden = !message;
    if (!message) return;
    const text = document.createElement('p');
    text.textContent = message;
    box.append(text);
    function button(label, handler) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      btn.style.cssText = 'margin-top:8px;margin-right:12px;text-decoration:underline;font-weight:600';
      btn.onclick = handler;
      box.append(btn);
    }
    if (retry) button('Coba pulihkan lagi', restoreSavedCart);
    if (discard) button('Kosongkan keranjang tersimpan', discardSavedCart);
  }

  function cartReadyForChanges() {
    if (cartCheckoutPending) {
      showToast('Pesanan sedang disimpan. Tunggu sampai proses selesai.');
      return false;
    }
    if (cartRestoreRequired) {
      toggleCartDrawer(true);
      showToast('Keranjang tersimpan sedang diperiksa. Coba pulihkan lagi atau kosongkan keranjang tersimpan.');
      return false;
    }
    return true;
  }

  function saveCartToStorage() {
    if (!cartStorageAvailable || cartRestoreRequired) return;
    try {
      const items = cartState.map(function(item) { return {id: String(item.id), qty: item.qty}; });
      if (!items.length) window.localStorage.removeItem(CART_STORAGE_KEY);
      else window.localStorage.setItem(CART_STORAGE_KEY, JSON.stringify({version: 1, savedAt: Date.now(), items: items}));
    } catch (error) {
      cartStorageAvailable = false;
      setCartNotice('Keranjang tidak dapat disimpan di perangkat ini. Anda tetap bisa berbelanja selama halaman terbuka.', false, false);
    }
  }

  function discardSavedCart() {
    if (cartCheckoutPending) return;
    cartRestoreVersion++;
    cartIsRestoring = false;
    cartRestoreRequired = false;
    cartState = [];
    setCartNotice('', false, false);
    updateCartBadge();
    renderCartUI();
    removeCoupon(true);
  }

  function restoreSavedCart() {
    if (cartIsRestoring || cartCheckoutPending) return;
    let raw;
    try { raw = window.localStorage.getItem(CART_STORAGE_KEY); }
    catch (error) {
      cartStorageAvailable = false;
      cartRestoreRequired = false;
      setCartNotice('Keranjang tidak dapat disimpan di perangkat ini. Anda tetap bisa berbelanja selama halaman terbuka.', false, false);
      return;
    }
    if (!raw) {
      cartRestoreRequired = false;
      setCartNotice('', false, false);
      return;
    }
    let items;
    try {
      if (raw.length > 30000) throw new Error('Invalid cart');
      const saved = JSON.parse(raw);
      if (!saved || saved.version !== 1 || !Number.isSafeInteger(saved.savedAt) || saved.savedAt <= 0 || saved.savedAt > Date.now() + 300000 || !Array.isArray(saved.items) || saved.items.length > 100) throw new Error('Invalid cart');
      if (Date.now() - saved.savedAt > CART_MAX_AGE_MS) {
        discardSavedCart();
        setCartNotice('Keranjang tersimpan sudah kedaluwarsa setelah 30 hari. Silakan pilih produk kembali.', false, false);
        return;
      }
      items = saved.items.map(function(item) {
        if (!item || typeof item.id !== 'string' || !item.id.trim() || item.id.length > 128 || !Number.isSafeInteger(item.qty) || item.qty < 1 || item.qty > 10000) throw new Error('Invalid cart');
        return {id: item.id.trim(), qty: item.qty};
      });
    } catch (error) {
      discardSavedCart();
      setCartNotice('Keranjang tersimpan tidak bisa dibaca. Silakan pilih produk kembali.', false, false);
      return;
    }
    if (!items.length) {
      discardSavedCart();
      return;
    }
    const version = ++cartRestoreVersion;
    cartRestoreRequired = true;
    cartIsRestoring = true;
    setCartNotice('Memulihkan keranjang serta memperbarui harga produk...', false, true);
    renderCartUI();
    safeRun('getCartSnapshot', function(res) {
      if (version !== cartRestoreVersion) return;
      cartIsRestoring = false;
      if (!res.success || !Array.isArray(res.items)) {
        setCartNotice('Keranjang tersimpan belum bisa diperiksa. Coba pulihkan lagi atau kosongkan jika ingin mulai belanja baru.', true, true);
        renderCartUI();
        return;
      }
      cartState = res.items;
      cartRestoreRequired = false;
      if(reconcileRecoveredReceipt_()) return;
      updateCartBadge();
      renderCartUI();
      if (!cartStorageAvailable) return;
      const changed = Array.isArray(res.adjustments) && res.adjustments.length > 0;
      setCartNotice(changed
        ? 'Keranjang dipulihkan. Produk yang tidak lagi terdaftar dihapus. Harga sudah diperbarui.'
        : 'Keranjang dipulihkan dengan harga terbaru. Ketersediaan dikonfirmasi melalui WhatsApp.', false, false);
    }, items);
  }


  function showDataError(message) {
    let box = document.getElementById('dataLoadError');
    if (!box) {
      box = document.createElement('div');
      box.id = 'dataLoadError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'margin:12px 0;padding:12px;border:1px solid #fecaca;border-radius:12px;background:#fef2f2;color:#991b1b;font-size:12px;white-space:pre-wrap';
      const host = document.querySelector('main') || document.body;
      host.prepend(box);
    }
    const text=node_('p','','Data belum bisa dimuat: '+message);
    const retry=node_('button','text-brand-blue font-bold mt-2','Coba muat ulang');retry.type='button';retry.onclick=function(){box.remove();initCustomerApp();};box.replaceChildren(text,retry);
  }

  function safeRun(serverFunction, callback, ...args) {
    function failed(error) {
      const message = error && error.message ? error.message : String(error);
      if (serverFunction === 'getInitialData') {
        showDataError(message);
      }
      showToast('Error Server: ' + message);
      callback({ success: false, message: message });
    }
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      failed(new Error('Buka aplikasi melalui URL web app Google Apps Script.'));
      return;
    }
    const runner = google.script.run.withSuccessHandler(function(res) {
      const result = res || { success: false, message: 'Server tidak mengembalikan data.' };
      if (serverFunction === 'getInitialData' && !result.success) {
        showDataError(result.message || 'Respons server tidak berhasil.');
      }
      callback(result);
    }).withFailureHandler(failed);
    runner[serverFunction](...args);
  }

  document.addEventListener('DOMContentLoaded', function() {
    restoreSavedCart();
    initCustomerApp();
    try { const id=localStorage.getItem('tokoAbangda.lastOrder'); if(id && validOrderIdClient_(id)) document.getElementById('trackOrderIdInput').value=id; } catch (_) {}
    setupInfiniteScroll();
    setupSearchDismissListener();
    recoverLastCheckout_();
    const couponInput = document.getElementById('coCouponCode');
    if (couponInput) couponInput.addEventListener('input', cancelCouponCheck_);
  });

  function setupSearchDismissListener() {
    document.addEventListener('click', function(e) {
      const container = document.getElementById('customerSearchContainer');
      const box = document.getElementById('searchSuggestionsBox');
      if (container && box && !container.contains(e.target)) {
        box.classList.add('hidden');
      }
    });
  }

  function setupInfiniteScroll() {
    window.addEventListener('scroll', function() {
      const pageKatalog = document.getElementById('pageKatalog');
      if (!pageKatalog || pageKatalog.classList.contains('hidden')) return;

      if (isLoadingProducts || !hasMoreProducts) return;

      const scrollPosition = window.innerHeight + window.scrollY;
      const threshold = document.body.offsetHeight - 250;

      if (scrollPosition >= threshold) {
        currentPage++;
        loadProducts(true);
      }
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toastAlert');
    document.getElementById('toastMsg').innerText = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    setTimeout(function() {
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2500);
  }

  function toggleSidebar() {
    const drawer = document.getElementById('sidebarDrawer');
    const overlay = document.getElementById('sidebarOverlay');
    
    const isOpen = !drawer.classList.contains('-translate-x-full');
    if (isOpen) {
      drawer.classList.add('-translate-x-full');
      overlay.classList.add('opacity-0', 'pointer-events-none');
    } else {
      toggleCartDrawer(false);
      drawer.classList.remove('-translate-x-full');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }
  }

  function toggleCartDrawer(forceState) {
    const drawer = document.getElementById('cartDrawer');
    const overlay = document.getElementById('cartOverlay');
    if (!drawer || !overlay) return;

    const isCurrentlyOpen = !drawer.classList.contains('translate-x-full');
    const shouldOpen = (forceState !== undefined) ? forceState : !isCurrentlyOpen;

    if (shouldOpen) {
      const sidebar = document.getElementById('sidebarDrawer');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.add('-translate-x-full');
        if (sidebarOverlay) sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
      }

      renderCartUI();
      drawer.classList.remove('translate-x-full');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      document.body.classList.add('overflow-hidden');
    } else {
      drawer.classList.add('translate-x-full');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      document.body.classList.remove('overflow-hidden');
    }
  }

  function proceedToCheckoutFromDrawer() {
    if (!cartReadyForChanges()) return;
    if (cartState.length === 0) {
      showToast('Keranjang belanjaan Anda masih kosong!');
      return;
    }
    toggleCartDrawer(false);
    switchTab('checkout');
  }

  function toggleSidebarAccordion(type) {
    if (type === 'category') {
      const list = document.getElementById('sidebarCategoryList');
      const icon = document.getElementById('accordionIconCategory');
      if (!list) return;

      const isHidden = list.classList.contains('hidden');
      if (isHidden) {
        list.classList.remove('hidden');
        if (icon) icon.classList.add('rotate-180');
      } else {
        list.classList.add('hidden');
        if (icon) icon.classList.remove('rotate-180');
      }
    } else if (type === 'brand') {
      const list = document.getElementById('sidebarBrandList');
      const icon = document.getElementById('accordionIconBrand');
      if (!list) return;

      const isHidden = list.classList.contains('hidden');
      if (isHidden) {
        list.classList.remove('hidden');
        if (icon) icon.classList.add('rotate-180');
      } else {
        list.classList.add('hidden');
        if (icon) icon.classList.remove('rotate-180');
      }
    }
  }

  function navFromSidebar(tab, catId, brandName) {
    toggleSidebar();
    if (tab === 'keranjang') {
      setTimeout(function() {
        toggleCartDrawer(true);
      }, 150);
      return;
    }

    if (catId) {
      activeBrandFilter = 'ALL';
      filterByCategory(catId);
    } else if (brandName) {
      activeCategoryFilter = 'ALL';
      filterByBrand(brandName);
    }
    switchTab(tab);
  }

  function showCatalogNotice_(count) {
    let box = document.getElementById('catalogAvailabilityNotice');
    if (!box) { box = node_('p','text-xs text-slate-600 my-2');box.id='catalogAvailabilityNotice';document.getElementById('catalogProductsGrid').before(box); }
    box.textContent = count > 0 ? 'Sebagian produk sementara tidak tersedia. Hubungi toko jika produk yang dicari belum terlihat.' : '';
    box.hidden = !(count > 0);
  }

  function initCustomerApp() {
    safeRun('getInitialData', function(res) {
      if (res.success) {
        showCatalogNotice_(res.catalogWarnings || 0);
        settingsState = res.settings || {};
        categoriesState = res.categories || [];
        brandsState = res.brands || [];
        bannersState = res.banners || [];

        renderStoreSettings(settingsState);
        let contactNotice = document.getElementById('storeContactNotice');
        if (!contactNotice) { contactNotice = node_('p','text-xs text-slate-600 my-2'); contactNotice.style.cssText='max-width:448px;margin:8px auto;padding:0 16px;box-sizing:border-box'; contactNotice.id='storeContactNotice'; document.getElementById('storeHeader').after(contactNotice); }
        contactNotice.textContent = settingsState.contactUnavailable ? 'Pemesanan WhatsApp sementara belum tersedia. Katalog tetap dapat dilihat.' : '';
        contactNotice.hidden = !settingsState.contactUnavailable;
        renderBanners(bannersState);
        renderCategories(categoriesState);
        renderBrands(brandsState);

        if (res.featuredProducts && res.featuredProducts.length > 0) {
          renderHomeProducts(res.featuredProducts);
        }
        loadProducts(false);
      }
    });
  }

  function renderStoreSettings(settings) {
    if (!settings) return;

    if (settings.nama_toko) {
      const hTitle = document.getElementById('headerStoreTitle');
      const sTitle = document.getElementById('sidebarStoreTitle');
      const fTitle = document.getElementById('footerStoreName');
      const sfName = document.getElementById('sidebarFooterStoreName');
      if (hTitle) hTitle.innerText = settings.nama_toko;
      if (sTitle) sTitle.innerText = settings.nama_toko;
      if (fTitle) fTitle.innerText = settings.nama_toko;
      if (sfName) sfName.innerText = settings.nama_toko;
    }

    const fAddress = document.getElementById('footerStoreAddress');
    if (fAddress) {
      let alamatHtml = 'Pusat Kebutuhan Harian & Sembako Terpercaya<br>';
      if (settings.alamat_toko) {
        alamatHtml += escapeHtml(settings.alamat_toko) + '<br>';
      }
      if (settings.no_telepon) {
        alamatHtml += escapeHtml(settings.no_telepon);
      }
      fAddress.innerHTML = alamatHtml;
    }

    bindSocialLink('footerLinkFb', settings.link_facebook);
    bindSocialLink('footerLinkIg', settings.link_instagram);
    bindSocialLink('footerLinkYt', settings.link_youtube);
    bindSocialLink('footerLinkTt', settings.link_tiktok);

    const waSocialEl = document.getElementById('footerLinkWa');
    if (waSocialEl) {
      if (settings.no_whatsapp) {
        let cleanWa = String(settings.no_whatsapp).replace(/[^0-9]/g, '');
        if(cleanWa.startsWith('0'))cleanWa='62'+cleanWa.slice(1);
        if(!/^[1-9]\d{7,14}$/.test(cleanWa)){waSocialEl.classList.add('hidden');waSocialEl.removeAttribute('href');return;}
        let storeName = encodeURIComponent(settings.nama_toko || 'Toko Abangda');
        waSocialEl.href = 'https://wa.me/' + cleanWa + '?text=Halo%20Admin%20' + storeName + ',%20saya%20ingin%20bertanya';
        waSocialEl.classList.remove('hidden');
      } else {
        waSocialEl.classList.add('hidden');
      }
    }
  }

  function bindSocialLink(elementId, url) {
    const el = document.getElementById(elementId);
    if (!el) return;

    if (url && String(url).trim() !== '' && String(url).trim() !== '#') {
      const safe = safeExternalUrl(url);
      if (!safe) { el.classList.add('hidden'); el.removeAttribute('href'); return; }
      el.href = safe;
      el.classList.remove('hidden');
    } else if (url === '#') {
      el.href = '#';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function safeExternalUrl(value) {
    try {
      const url = new URL(String(value || '').trim());
      if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password) return '';
      url.protocol = 'https:';
      return url.href;
    } catch (_) { return ''; }
  }

  function formatImageUrl(value) {
    const fallback = 'https://placehold.co/200x200/f1f5f9/94a3b8?text=No+Image';
    const safe = safeExternalUrl(value); if (!safe) return fallback;
    const url = new URL(safe);
    if (['drive.google.com','docs.google.com'].includes(url.hostname)) {
      const match = url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      const id = match ? match[1] : url.searchParams.get('id');
      if (id && /^[a-zA-Z0-9_-]+$/.test(id)) return 'https://lh3.googleusercontent.com/d/' + id;
    }
    return safe;
  }

  function node_(tag, classes, text) {
    const node = document.createElement(tag); node.className = classes || '';
    if (text !== undefined) node.textContent = String(text); return node;
  }

  function image_(url, classes, alt) {
    const img = node_('img', classes); img.src = formatImageUrl(url); img.alt = alt || '';
    img.loading = 'lazy'; img.onerror = function() { this.onerror = null; this.src = formatImageUrl(''); };
    return img;
  }

  function renderBanners(banners) {
    const slider = document.getElementById('bannerSlider'); if (!slider) return;
    slider.replaceChildren();
    if (!banners || !banners.length) {
      slider.append(node_('div','w-full bg-slate-200 h-28 rounded-2xl flex items-center justify-center text-xs text-slate-500','Toko Abangda Promo')); return;
    }
    banners.forEach(function(b) {
      const tile = node_('div','min-w-full snap-center bg-slate-800 h-36 rounded-2xl overflow-hidden relative shadow-sm');
      const image = image_(b.url_gambar,'w-full h-full object-cover opacity-90',b.keterangan || 'Banner toko');
      const href = safeExternalUrl(b.link);
      if (href) { const link = node_('a','block w-full h-full'); link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.append(image); tile.append(link); }
      else tile.append(image);
      slider.append(tile);
    });
  }

  function renderCategories(categories) {
    const grid = document.getElementById('categoryGrid');
    const pills = document.getElementById('filterCategoryPills');
    const sidebar = document.getElementById('sidebarCategoryList');
    if (grid) grid.replaceChildren();
    if (pills) pills.replaceChildren();
    if (sidebar) sidebar.replaceChildren();
    function pill(id, name) {
      const button = document.createElement('button');
      button.type = 'button'; button.id = 'pill-' + id; button.textContent = name;
      button.className = id === 'ALL' ? 'cat-pill active-pill px-3.5 py-1.5 bg-brand-blue text-white rounded-full text-[10px] font-bold whitespace-nowrap' : 'cat-pill px-3.5 py-1.5 bg-slate-100 text-slate-600 rounded-full text-[10px] font-semibold whitespace-nowrap';
      button.onclick = function() { filterByCategory(id); };
      if (pills) pills.append(button);
    }
    pill('ALL', 'Semua');
    categories.forEach(function(category) {
      const button = document.createElement('button');
      button.type = 'button'; button.title = category.nama;
      button.className = 'bg-white p-3 rounded-2xl border border-slate-100 flex flex-col items-center justify-center text-center category-tile';
      const image = document.createElement('img');
      image.src = formatImageUrl(category.url_ikon || 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png');
      image.alt = ''; image.className = 'w-8 h-8 object-contain mb-2';
      image.onerror = function() { this.onerror = null; this.src = 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png'; };
      const label = document.createElement('span');
      label.className = 'category-name text-xs font-semibold text-slate-700';
      label.textContent = category.nama;
      button.append(image, label);
      button.onclick = function() { filterByCategory(category.id_kategori); switchTab('katalog'); };
      if (grid) grid.append(button);
      pill(category.id_kategori, category.nama);
      const entry = document.createElement('button');
      entry.type = 'button'; entry.className = 'w-full px-3 py-2 rounded-xl text-xs text-slate-700 text-left category-name';
      entry.textContent = category.nama;
      entry.onclick = function() { navFromSidebar('katalog', category.id_kategori, null); };
      if (sidebar) sidebar.append(entry);
    });
  }

  function renderBrands(brands) {
    const list = document.getElementById('sidebarBrandList'); if (!list) return;
    list.replaceChildren();
    if (!brands || !brands.length) { list.append(node_('p','text-[10px] text-slate-400 px-3 py-1','Belum ada brand terdaftar.')); return; }
    brands.forEach(function(b) {
      const button = node_('button','w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs text-slate-700 hover:bg-slate-100 transition group');
      button.type = 'button'; button.append(node_('span','min-w-0 whitespace-normal break-words',b.nama_brand));
      button.append(node_('i','fa-solid fa-chevron-right text-[10px] text-slate-300'));
      button.onclick = function() { navFromSidebar('katalog',null,b.nama_brand); };
      list.append(button);
    });
  }

  function loadProducts(isAppend) {
    if (isAppend && isLoadingProducts) return;
    const version = ++catalogRequestVersion;
    const requestedPage = isAppend ? currentPage : 1;
    currentPage = requestedPage;
    isLoadingProducts = true;

    const searchInput = document.getElementById('searchInput');
    const searchVal = searchInput ? searchInput.value.trim() : '';
    const loadingIndicator = document.getElementById('catalogLoadingIndicator');
    const endMessage = document.getElementById('catalogEndMessage');

    if (loadingIndicator && isAppend) {
      loadingIndicator.classList.remove('hidden');
    }

    const brandBanner = document.getElementById('activeBrandBanner');
    const brandLabel = document.getElementById('activeBrandLabel');
    if (brandBanner && brandLabel) {
      if (activeBrandFilter !== 'ALL') {
        brandLabel.innerText = activeBrandFilter;
        brandBanner.classList.remove('hidden');
      } else {
        brandBanner.classList.add('hidden');
      }
    }

    safeRun('getProducts', function(res) {
      if (version !== catalogRequestVersion) return;
      isLoadingProducts = false;
      if (loadingIndicator) loadingIndicator.classList.add('hidden');

      if (res.success) {
        showCatalogNotice_(res.catalogWarnings || 0);
        if (!isAppend) {
          renderCatalogProducts(res.data, false);
        } else {
          renderCatalogProducts(res.data, true);
        }

        hasMoreProducts = res.currentPage < res.totalPages;

        const catalogCount = document.getElementById('catalogCount');
        if (catalogCount) catalogCount.innerText = res.totalItems + ' Produk';

        if (endMessage) {
          if (!hasMoreProducts && res.totalItems > 0) {
            endMessage.classList.remove('hidden');
          } else {
            endMessage.classList.add('hidden');
          }
        }
      }
      if (!res.success) { showDataError(res.message || 'Katalog belum dapat dimuat.'); if (isAppend) currentPage = Math.max(1, requestedPage - 1); }
      if (res.success) { const box = document.getElementById('dataLoadError'); if (box) box.remove(); }
    }, searchVal, activeCategoryFilter, activeBrandFilter, requestedPage, limitPage);
  }

  function renderHomeProducts(products) {

    const suggestionsBox = document.getElementById('searchSuggestionsBox');
    const searchVal = input ? input.value : '';

    if (clearBtn) {
      if (searchVal.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    // Jika user mengetik, otomatis pindah langsung ke tab katalog jika belum berada di katalog
    if (searchVal.trim().length > 0) {
      const pageKatalog = document.getElementById('pageKatalog');
      if (pageKatalog && pageKatalog.classList.contains('hidden')) {
        switchTab('katalog');
      }
    }

    // Reset timer debounce agar sistem tidak lag saat mengetik cepat
    if (searchDebounceTimer) {
      clearTimeout(searchDebounceTimer);
    }

    if (searchVal.trim().length === 0) {
      if (suggestionsBox) {
        suggestionsBox.innerHTML = '';
        suggestionsBox.classList.add('hidden');
      }
      currentPage = 1;
      hasMoreProducts = true;
      loadProducts(false);
      return;
    }

    // Tampilkan kotak saran dengan indikator memuat ringkas
    if (suggestionsBox) {
      suggestionsBox.innerHTML = '<div class="p-3 text-center text-xs text-slate-400 flex items-center justify-center gap-2"><i class="fa-solid fa-circle-notch animate-spin text-brand-blue"></i><span>Mencari saran produk...</span></div>';
      suggestionsBox.classList.remove('hidden');
    }

    searchDebounceTimer = setTimeout(function() {
      // 1. Muat ulang produk katalog sesuai kata pencarian
      currentPage = 1;
      hasMoreProducts = true;
      loadProducts(false);

      // 2. Ambil saran produk live untuk dropdown
      fetchSearchSuggestions(searchVal.trim());
    }, 250);

    const item = existing || {id:id, nama:nama, url_foto:url_foto || '', brand:brand || ''};
    item.qty = next;
    item.satuan = details.satuan || item.satuan || 'pcs';
    item.harga_normal = Number(details.harga);
    item.harga_grosir = Number(details.harga_grosir) || 0;
    item.min_beli_grosir = Number(details.min_beli_grosir) || 0;

  function applyCoupon() {
    if (!cartReadyForChanges()) return;
    if (couponCheckPending) return;
    repriceCart();
    const input = document.getElementById('coCouponCode');
    const code = input ? input.value.trim().toUpperCase() : '';
    if (!code || code.length > 64) { showToast('Masukkan kode kupon yang valid.'); return; }
    const subtotal = cartState.reduce(function(sum,item) { return sum + item.harga * item.qty; },0);
    if (subtotal <= 0) { showToast('Keranjang belanja Anda masih kosong!'); return; }
    const version = ++couponCheckVersion, btn = document.getElementById('btnApplyCoupon');
    couponCheckPending = true; btn.disabled = true; btn.textContent = 'Cek…';
    function complete(res) {
      if (version !== couponCheckVersion) return;
      cancelCouponCheck_();
      if (!input || input.value.trim().toUpperCase() !== code) return;
      if (res.success) {
        // Keep the original server timestamp: a cache hit must not extend its lifetime.
        if (!res.fromLocalMemo) couponPreviewMemo.set(code,{at:Date.now(),until:Math.min(Date.now()+30000,res.previewExpiresAt || Date.now()+30000),result:res});
        appliedCoupon = res;
        document.getElementById('couponInputGroup').classList.add('hidden');
        document.getElementById('couponAppliedBox').classList.remove('hidden');
        document.getElementById('appliedCouponLabel').textContent = res.code;
        updateCheckoutTotals();
        if(appliedCoupon)showToast('Voucher diterapkan. Hemat Rp '+appliedCoupon.discountAmount.toLocaleString('id-ID'));
      } else { couponPreviewMemo.delete(code); showToast(res.message || 'Kupon tidak dapat digunakan.'); }
    }
    const memo = couponPreviewMemo.get(code);
    if (memo && Date.now() >= memo.at && Date.now() < memo.until) { complete(Object.assign({},memo.result,{fromLocalMemo:true})); return; }
    couponSlowTimer = setTimeout(function(){ if(version===couponCheckVersion) btn.textContent='Tunggu…'; },4000);
    couponTimeoutTimer = setTimeout(function(){
      if (version !== couponCheckVersion) return;
      cancelCouponCheck_();showToast('Pemeriksaan voucher terlalu lama. Coba lagi; pesanan belum dikirim.');
    },12000);
    safeRun('validateCoupon',complete,code,subtotal);
  }

  function removeCoupon(silently) {
    cancelCouponCheck_();
    appliedCoupon = null;
    const input = document.getElementById('coCouponCode');
    if (input) input.value = '';

    const inputGroup = document.getElementById('couponInputGroup');
    const appliedBox = document.getElementById('couponAppliedBox');
    if (inputGroup) inputGroup.classList.remove('hidden');
    if (appliedBox) appliedBox.classList.add('hidden');

    updateCheckoutTotals();
    if (!silently) {
      showToast('Kupon diskon dibatalkan.');
    }
  }

  function updateCheckoutTotals() {
    repriceCart();
    const subtotal = cartState.reduce(function(acc, item) { return acc + (item.harga * item.qty); }, 0);
    let diskonNominal = 0;

    if (appliedCoupon) {
      if (subtotal < appliedCoupon.minBelanja) {
        showToast('Subtotal di bawah batas minimal kupon ' + appliedCoupon.code + ', kupon dilepas.');
        removeCoupon(true);
        return;
      }

      if (appliedCoupon.type === 'PERSEN') {
        diskonNominal = Math.round((subtotal * appliedCoupon.value) / 100);
      } else {
        diskonNominal = Math.min(appliedCoupon.value, subtotal);
      }
      appliedCoupon.discountAmount = diskonNominal;

      const desc = document.getElementById('appliedCouponDesc');
      if (desc) desc.innerText = 'Hemat Rp ' + diskonNominal.toLocaleString('id-ID') + (appliedCoupon.type === 'PERSEN' ? ' (' + appliedCoupon.value + '%)' : '');

      const diskonRow = document.getElementById('coDiskonRow');
      const diskonLabel = document.getElementById('coDiskonLabel');
      const diskonNilai = document.getElementById('coDiskonNilai');
      if (diskonRow) diskonRow.classList.remove('hidden');
      if (diskonLabel) diskonLabel.innerText = 'Diskon (' + appliedCoupon.code + '):';
      if (diskonNilai) diskonNilai.innerText = '-Rp ' + diskonNominal.toLocaleString('id-ID');
    } else {
      const diskonRow = document.getElementById('coDiskonRow');
      if (diskonRow) diskonRow.classList.add('hidden');
    }

    const finalTotal = Math.max(0, subtotal - diskonNominal);

    const cartTotalEl = document.getElementById('cartTotalPrice');
    const subtotalEl = document.getElementById('coSubtotalTagihan');
    const totalTagihanEl = document.getElementById('coTotalTagihan');

    if (cartTotalEl) cartTotalEl.innerText = 'Rp ' + subtotal.toLocaleString('id-ID');
    if (subtotalEl) subtotalEl.innerText = 'Rp ' + subtotal.toLocaleString('id-ID');
    if (totalTagihanEl) totalTagihanEl.innerText = 'Rp ' + finalTotal.toLocaleString('id-ID');
  }

  function changeCartQty(idx, delta) {
    if (!cartReadyForChanges()) return;
    const item = cartState[idx];
    if (!item) return;
    const next = item.qty + delta;
    if (!Number.isSafeInteger(next) || next > 10000) {showToast('Maksimal 10.000 unit per produk.');return;}
    if (next <= 0) cartState.splice(idx, 1);
    else item.qty = next;
    updateCartBadge();
    renderCartUI();
  }

  function removeCartItem(idx) {
    if (!cartReadyForChanges()) return;
    cartState.splice(idx, 1);
    updateCartBadge();
    renderCartUI();
  }

  function toggleAlamatInput() {
    const tipe = document.getElementById('coTipe').value;
    const alamatBox = document.getElementById('alamatBox');
    if (tipe === 'Takeaway') {
      alamatBox.classList.add('hidden');
    } else {
      alamatBox.classList.remove('hidden');
    }
  }

// Persist only a random attempt key. Keep it across reload/edit until a confirmed result.
let checkoutAttempt = null;
function checkoutRequestId_(payload) {
  if (!checkoutAttempt) { try { checkoutAttempt = JSON.parse(localStorage.getItem('tokoAbangda.checkout.v1') || 'null'); } catch (_) {} }
  if (!checkoutAttempt || !/^[a-f0-9]{64}$/.test(checkoutAttempt.key)) {
    const bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
    checkoutAttempt = {key:Array.from(bytes,function(n) { return n.toString(16).padStart(2,'0'); }).join('')};
  }
  try { localStorage.setItem('tokoAbangda.checkout.v1', JSON.stringify(checkoutAttempt)); } catch (_) {}
  return checkoutAttempt.key;
}

function rememberReceipt_(key) {
  try {localStorage.setItem('tokoAbangda.receipt.v1',JSON.stringify({key:key,at:Date.now()}));}catch(_){showToast('Simpan ID pesanan sebelum menutup halaman; perangkat ini tidak menyimpan riwayat.');}
}
function reconcileRecoveredReceipt_() {
  if(!recoveredReceipt || cartRestoreRequired || cartCheckoutPending)return;
  let pendingKey=checkoutAttempt&&checkoutAttempt.key;try{const pending=JSON.parse(localStorage.getItem('tokoAbangda.checkout.v1')||'null');pendingKey=pending&&pending.key||pendingKey;}catch(_){}
  if(pendingKey!==recoveredReceipt.key)return;
  const signature=items=>JSON.stringify(items.map(item=>[String(item.id),item.qty]).sort((a,b)=>a[0].localeCompare(b[0])));
  if(cartState.length && signature(cartState)!==signature(recoveredReceipt.summary.items))return;
  try{const pending=JSON.parse(localStorage.getItem('tokoAbangda.checkout.v1')||'null');if(pending&&pending.key===recoveredReceipt.key)localStorage.removeItem('tokoAbangda.checkout.v1');}catch(_){}
  checkoutAttempt=null;
  if(cartState.length)discardSavedCart();
  return true;
}
function recoverLastCheckout_(explicitKey,target) {
  let key=explicitKey;
  if(!key){
    try{
      const pending=JSON.parse(localStorage.getItem('tokoAbangda.checkout.v1')||'null');
      const last=JSON.parse(localStorage.getItem('tokoAbangda.receipt.v1')||'null');
      key=pending&&/^[a-f0-9]{64}$/.test(String(pending.key||''))?pending.key:null;
      if(!key&&last&&Date.now()>=last.at&&Date.now()-last.at<30*86400000)key=last.key;
    }catch(_){}
  }
  if(!/^[a-f0-9]{64}$/.test(String(key||''))){closeCheckoutWindow_(target);return;}
  safeRun('recoverCheckout',function(res){
    if(res.success&&res.found&&res.result){
      rememberReceipt_(key);recoveredReceipt={key:key,summary:res.result.summary};reconcileRecoveredReceipt_();
      try{localStorage.setItem('tokoAbangda.lastOrder',res.result.orderId);}catch(_){}
      handoffWhatsApp_(res.result,target);return;
    }
    closeCheckoutWindow_(target);
    if(res.existingOrderId){
      try{const pending=JSON.parse(localStorage.getItem('tokoAbangda.checkout.v1')||'null');if(pending&&pending.key===key)localStorage.removeItem('tokoAbangda.checkout.v1');}catch(_){}
      if(checkoutAttempt&&checkoutAttempt.key===key)checkoutAttempt=null;
      handoffWhatsApp_({orderId:res.existingOrderId,cancelled:true},null);return;
    }
    if(!res.success){
      let box=document.getElementById('receiptRecoveryNotice');if(!box){box=node_('div','text-xs text-slate-600 my-2');box.id='receiptRecoveryNotice';document.querySelector('main').prepend(box);}
      const retry=node_('button','text-brand-blue font-bold','Pulihkan pesan pesanan terakhir');retry.type='button';retry.onclick=function(){box.remove();recoverLastCheckout_(key,null);};box.replaceChildren(retry);
    }
  },key);
}

function showPreviousCheckout_(id) {
  let box = document.getElementById('previousCheckoutNotice');
  if (!box) { box=node_('div','bg-sky-50 border border-sky-200 p-3 rounded-xl text-xs space-y-2');box.id='previousCheckoutNotice';document.getElementById('btnSubmitCheckout').before(box); }
  const text=node_('p','','Pesanan sebelumnya sudah tercatat: '+id+'. Data baru belum disimpan.');
  const track=node_('button','text-brand-blue font-bold mr-3','Lacak pesanan sebelumnya');track.type='button';track.onclick=function(){clearTrackingResult();document.getElementById('trackOrderIdInput').value=id;switchTab('lacak');};
  const reset=node_('button','text-brand-blue font-bold','Mulai pesanan baru');reset.type='button';reset.onclick=function(){checkoutAttempt=null;try{localStorage.removeItem('tokoAbangda.checkout.v1');}catch(_){}box.remove();showToast('Silakan periksa data lalu kirim sebagai pesanan baru.');};
  const resume=node_('button','text-brand-blue font-bold mr-3','Kirim pesanan sebelumnya');resume.type='button';resume.onclick=function(){if(checkoutAttempt)recoverLastCheckout_(checkoutAttempt.key,openCheckoutWindow_());};
  box.replaceChildren(text,resume,track,reset);
}

function openCheckoutWindow_() {
  try {
    const target = window.open('about:blank','_blank');
    if (target) {
      target.opener = null;
      try { target.document.title = 'Menyiapkan WhatsApp'; target.document.body.textContent = 'Sedang menyimpan pesanan. WhatsApp akan terbuka setelah pesanan tercatat.'; } catch (_) {}
    }
    return target;
  } catch (_) { return null; }
}

function closeCheckoutWindow_(target) {
  try { if (target && !target.closed) target.close(); } catch (_) {}
}

function handoffWhatsApp_(res, target) {
  let href = '';
  try { const url = new URL(res.waUrl); if (url.origin === 'https://wa.me' && /^\/\d+$/.test(url.pathname)) href = url.href; } catch (_) {}
  let opened = false;
  if (href) { try { if(target && !target.closed) { target.location.replace(href); opened = true; } } catch (_) {} }
  if (!opened) closeCheckoutWindow_(target);
  let notice = document.getElementById('orderHandoffNotice');
  if (!notice) { notice=node_('div','bg-sky-50 border border-sky-200 p-3 rounded-xl text-xs space-y-2 mb-3');notice.id='orderHandoffNotice';document.querySelector('main').prepend(notice); }
  const line=node_('p','','Pesanan ');const id=node_('strong','',res.orderId);id.id='lastOrderId';line.append(id,document.createTextNode(res.cancelled ? ' sudah dibatalkan.' : opened ? ' sudah tercatat.' : ' sudah tercatat. Tekan tautan di bawah untuk membuka WhatsApp.'));
  notice.replaceChildren(line);
  if(href){const link=node_('a','inline-flex text-brand-blue font-bold mr-3',opened ? 'Buka WhatsApp lagi' : 'Buka WhatsApp');link.id='orderWhatsAppLink';link.href=href;link.target='_blank';link.rel='noopener noreferrer';notice.append(link);}
  const track=node_('button','text-brand-blue font-bold','Lacak Pesanan Ini');track.type='button';track.onclick=function(){clearTrackingResult();document.getElementById('trackOrderIdInput').value=res.orderId;switchTab('lacak');};notice.append(track);
}

function submitCheckout() {
    if (couponCheckPending) { showToast('Tunggu pemeriksaan voucher selesai atau hapus kode voucher terlebih dahulu.'); return; }
    if (!cartReadyForChanges()) return;
  if (!cartState.length) {
    showToast('Keranjang masih kosong!');
    return;
  }
  const btn = document.getElementById('btnSubmitCheckout');
  if (btn.disabled) return;
  const nama = document.getElementById('coNama').value.trim();
  const wa = document.getElementById('coWa').value.trim();
  const tipe = document.getElementById('coTipe').value;
  const alamat = document.getElementById('coAlamat').value.trim();
  const catatan = document.getElementById('coCatatan').value.trim();
  if (!nama || !wa || (tipe === 'Delivery' && !alamat)) {
    showToast('Lengkapi bidang formulir yang wajib!');
    return;
  }
  const payload = {
    nama_pemesan: nama, no_whatsapp: wa, tipe_pengiriman: tipe,
    alamat: alamat, catatan: catatan,
    items: cartState.map(function(item) { return { id: item.id, qty: item.qty }; }),
    kode_kupon: appliedCoupon ? appliedCoupon.code : ''
  };
  payload.request_id = checkoutRequestId_(payload);
  // Reserve a tab during the click gesture; delayed RPC callbacks cannot reliably open popups.
  const whatsappWindow = openCheckoutWindow_();
  cartCheckoutPending = true;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> MENYIMPAN PESANAN...';
  safeRun('createOrder', function(res) {
    cartCheckoutPending = false;
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-brands fa-whatsapp text-lg"></i><span>Lanjut ke WhatsApp</span>';
    if (!res.success) {
      closeCheckoutWindow_(whatsappWindow);
      if(res.existingOrderId)showPreviousCheckout_(res.existingOrderId);
      showToast(res.message || 'Pesanan belum berhasil disimpan.');
      return;
    }
    rememberReceipt_(payload.request_id);
    checkoutAttempt = null;
    try { localStorage.removeItem('tokoAbangda.checkout.v1'); localStorage.setItem('tokoAbangda.lastOrder',res.orderId); } catch (_) {}
    couponPreviewMemo.clear();
    const trackInput = document.getElementById('trackOrderIdInput');
    clearTrackingResult();
    if (trackInput) trackInput.value = res.orderId;
    cartState = [];
    updateCartBadge();
    renderCartUI();
    removeCoupon(true);
    switchTab('home');
    handoffWhatsApp_(res,whatsappWindow);
  }, payload);
}


  function getStatusTheme(status) {
    const clean = String(status || '').trim();

    switch (clean) {
      case 'Menunggu Konfirmasi Stok':
        return {
          badgeClass: 'bg-amber-50 text-amber-800 border-amber-300',
          icon: '<i class="fa-solid fa-boxes-stacked text-amber-600"></i>',
          desc: 'Admin sedang memeriksa ketersediaan stok fisik barang di toko.'
        };
      case 'Menunggu Pembayaran':
        return {
          badgeClass: 'bg-orange-50 text-orange-800 border-orange-300',
          icon: '<i class="fa-solid fa-clock text-orange-600"></i>',
          desc: 'Stok tersedia! Menunggu konfirmasi pembayaran / transfer dari pembeli.'
        };
      case 'Sedang Diproses':
        return {
          badgeClass: 'bg-sky-50 text-sky-800 border-sky-300',
          icon: '<i class="fa-solid fa-box-open text-sky-600"></i>',
          desc: 'Pesanan sedang diproses dan dikemas oleh toko.'
        };
      case 'Sedang Dikirim':
        return {
          badgeClass: 'bg-indigo-50 text-indigo-800 border-indigo-300',
          icon: '<i class="fa-solid fa-truck-fast text-indigo-600"></i>',
          desc: 'Pesanan sedang dalam pengiriman kurir ke alamat Anda.'
        };
      case 'Sudah Diterima Pembeli':
      case 'Selesai':
        return {
          badgeClass: 'bg-emerald-50 text-emerald-800 border-emerald-300',
          icon: '<i class="fa-solid fa-circle-check text-emerald-600"></i>',
          desc: 'Pesanan telah selesai dan diterima dengan baik. Terima kasih!'
        };
      case 'Pesanan Dibatalkan':
      case 'Dibatalkan':
        return {
          badgeClass: 'bg-red-50 text-red-800 border-red-300',
          icon: '<i class="fa-solid fa-circle-xmark text-red-600"></i>',
          desc: 'Pesanan ini telah dibatalkan.'
        };
      default:
        return {
          badgeClass: 'bg-slate-100 text-slate-700 border-slate-300',
          icon: '<i class="fa-solid fa-info-circle text-slate-500"></i>',
          desc: 'Pesanan sedang diverifikasi oleh sistem.'
        };
    }
  }

  function clearTrackingResult() {
    trackingRequestVersion++;
    const box = document.getElementById('trackResultBox');
    if (box) {
      box.textContent = '';
      box.classList.add('hidden');
    }
    const button = document.getElementById('btnSubmitTrack');
    if (button) {
      button.disabled = false;
      button.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Cari';
    }
  }

  function submitTrackOrder() {
    const input = document.getElementById('trackOrderIdInput');
    const orderId = input ? input.value.trim() : '';
    const resultBox = document.getElementById('trackResultBox');
    const btn = document.getElementById('btnSubmitTrack');
    if (!btn || !resultBox || btn.disabled) return;
    clearTrackingResult();
    if (!validOrderIdClient_(orderId)) {
      showToast('Masukkan ID pesanan yang diberikan saat checkout.');
      return;
    }
    const version = ++trackingRequestVersion;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Memeriksa';
    safeRun('trackOrder', function(res) {
      if (version !== trackingRequestVersion) return;
      if (input.value.trim() !== orderId) {
        clearTrackingResult();
        return;
      }
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Cari';
      if (!res.success || !res.order) {
        resultBox.textContent = res.message || 'ID pesanan tidak ditemukan.';
        resultBox.className = 'bg-red-50 text-red-700 p-3 rounded-xl text-xs border border-red-100';
        return;
      }
      const order = res.order;
      const theme = getStatusTheme(order.status);
      let html = '<div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">';
      html += '<div class="border-b border-slate-100 pb-2.5">';
      html += '<p class="text-[10px] text-slate-400">ID Pesanan</p>';
      html += '<p class="font-mono font-bold text-slate-800 text-sm">' + escapeHtml(order.id_pesanan) + '</p>';
      html += '<p class="text-[10px] text-slate-400 mt-0.5">' + escapeHtml(order.tgl_pesan) + '</p>';
      html += '<span class="inline-flex mt-2 px-3 py-1 rounded-full text-[10px] font-bold border items-center gap-1.5 ' + theme.badgeClass + '">' + theme.icon + ' ' + escapeHtml(order.status) + '</span></div>';
      html += '<p class="text-xs text-slate-600">' + escapeHtml(theme.desc) + '</p>';
      if(order.legacy){
        html += '<p class="text-xs text-slate-600">Pesanan lama hanya menampilkan status. Hubungi toko untuk rincian pesanan.</p></div>';
        resultBox.className='space-y-2';resultBox.innerHTML=html;return;
      }
      html += '<p class="text-xs text-slate-600"><strong>Pengiriman:</strong> ' + escapeHtml(order.tipe_pengiriman==='Delivery'?'Diantar':'Ambil Sendiri') + '</p>';
      html += '<div class="space-y-1.5 border-t border-slate-100 pt-2"><p class="text-[11px] font-semibold text-slate-700">Detail Item:</p>';
      (Array.isArray(order.items) ? order.items : []).forEach(function(item) {
        const price = Number(item.harga) || 0;
        const qty = Number(item.qty) || 0;
        html += '<div class="flex justify-between gap-2 text-[11px] text-slate-600 border-b border-slate-50 pb-1"><span>' + escapeHtml(item.nama) + (item.brand ? ' [' + escapeHtml(item.brand) + ']' : '') + ' (x' + qty + ' ' + escapeHtml(item.satuan || 'pcs') + ')</span><span>Rp ' + (price * qty).toLocaleString('id-ID') + '</span></div>';
      });
      html += '</div>';
      function amount(label,value) { return '<div class="flex justify-between text-xs gap-2"><span>'+label+'</span><span>Rp '+(Number(value)||0).toLocaleString('id-ID')+'</span></div>'; }
      html += amount('Subtotal produk',order.subtotal)+amount('Diskon',order.diskon)+amount('Total produk',order.total_harga);
      if(order.total_final!=null) html += amount('Ongkir disepakati',order.ongkir)+amount('Total akhir disepakati',order.total_final);
      else html += '<p class="text-xs text-slate-500">Ongkir dan total akhir menunggu konfirmasi toko.</p>';
      html += '<p class="text-xs">Pembayaran: '+escapeHtml(order.status_pembayaran || 'Belum Dikonfirmasi')+'</p></div>';
      resultBox.className = 'space-y-2';
      resultBox.innerHTML = html;
    }, orderId);
  }

  function switchTab(tab) {
    if (tab === 'keranjang') {
      toggleCartDrawer(true);
      return;
    }

    const categoryBar = document.getElementById('filterCategoryPills');
    if (categoryBar) categoryBar.classList.toggle('hidden', tab !== 'katalog');

    const pages = ['Home', 'Katalog', 'Checkout', 'Lacak', 'CaraOrder'];
    pages.forEach(function(p) {
      const el = document.getElementById('page' + p);
      if (el) el.classList.add('hidden');
    });

    const activeEl = document.getElementById('page' + tab.charAt(0).toUpperCase() + tab.slice(1));
    if (activeEl) activeEl.classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
